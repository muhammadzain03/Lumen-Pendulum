<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Glow filter for the tip -->
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Fading trail gradient -->
    <linearGradient id="trail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4466bb" stop-opacity="0"/>
      <stop offset="60%"  stop-color="#66aaff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#aaddff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Dark background with rounded corners -->
  <rect width="32" height="32" rx="7" fill="#02040a"/>

  <!-- Subtle trail arc behind the pendulum path -->
  <path d="M 8 28 Q 14 20 18 14 Q 21 9 19 6" 
        fill="none" 
        stroke="url(#trail)" 
        stroke-width="1.5" 
        stroke-linecap="round"/>

  <!-- Arm 1: pivot to joint 1 -->
  <line x1="16" y1="7" x2="11" y2="14"
        stroke="#4a6a8a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Arm 2: joint 1 to joint 2 -->
  <line x1="11" y1="14" x2="18" y2="21"
        stroke="#4a6a8a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Arm 3: joint 2 to tip -->
  <line x1="18" y1="21" x2="13" y2="27"
        stroke="#4a6a8a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Pivot ring at top -->
  <circle cx="16" cy="7" r="2.2"
          fill="none" stroke="#88ccff" stroke-width="1.2" opacity="0.9"/>

  <!-- Intermediate joint 1 -->
  <circle cx="11" cy="14" r="1.2" fill="#6b9bc4"/>

  <!-- Intermediate joint 2 -->
  <circle cx="18" cy="21" r="1.2" fill="#6b9bc4"/>

  <!-- Tip — bright, glowing -->
  <circle cx="13" cy="27" r="2" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="13" cy="27" r="1" fill="#cceeff"/>
</svg>
